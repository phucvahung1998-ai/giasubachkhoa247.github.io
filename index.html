<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trung Tâm Gia Sư Bách Khoa 247</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
        }

        /* Header Banner */
        .hero-section {
            background: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.75)), url('https://images.unsplash.com/photo-1523240795612-9a054b0db644?q=80&w=1200') center/cover no-repeat;
            color: #fff;
            text-align: center;
            padding: 80px 20px;
        }

        .hero-section h1 {
            font-size: 2.8rem;
            color: #ffffff;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .hero-section p {
            font-size: 1.2rem;
            max-width: 800px;
            margin: 0 auto 25px;
            line-height: 1.6;
            color: #e2e8f0;
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        /* Modal Box */
        .modal-box {
            background: #ffffff;
            width: 90%;
            max-width: 450px;
            border-radius: 12px;
            padding: 30px 25px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            position: relative;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 24px;
            color: #94a3b8;
            cursor: pointer;
            font-weight: bold;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: #0f172a;
        }

        .modal-title {
            text-align: center;
            font-size: 1.6rem;
            color: #1e3a8a;
            margin-bottom: 20px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: #2563eb;
        }

        textarea.form-control {
            resize: vertical;
            height: 100px;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #16a34a;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: background-color 0.2s;
            margin-top: 5px;
        }

        .btn-submit:hover {
            background-color: #15803d;
        }

        .btn-open-modal {
            padding: 12px 28px;
            background-color: #2563eb;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-open-modal:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header class="hero-section">
        <h1>TRUNG TÂM GIA SƯ BÁCH KHOA 247</h1>
        <p>Cung cấp gia sư Sinh viên & Giáo viên giỏi, uy tín. Dạy kèm tại nhà tất cả các môn từ lớp 1 - 12, luyện thi đại học, Tiếng Anh / C++.</p>
        <button class="btn-open-modal" onclick="openModal()">ĐĂNG KÝ TƯ VẤN NGAY</button>
    </header>

    <!-- Modal Pop-up Form -->
    <div class="modal-overlay" id="consultModal">
        <div class="modal-box">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 class="modal-title">ĐĂNG KÝ TƯ VẤN</h2>
            
            <div class="form-group">
                <input type="text" id="modal-name" class="form-control" placeholder="Họ tên (*)" required>
            </div>
            
            <div class="form-group">
                <input type="tel" id="modal-phone" class="form-control" placeholder="Điện thoại (*)" required>
            </div>
            
            <div class="form-group">
                <textarea id="modal-msg" class="form-control" placeholder="Lời nhắn (Nhu cầu tìm gia sư...)"></textarea>
            </div>
            
            <button class="btn-submit" onclick="submitModalForm()">ĐĂNG KÝ NGAY</button>
        </div>
    </div>

    <script>
        // Hàm mở Modal
        function openModal() {
            document.getElementById('consultModal').style.display = 'flex';
        }

        // Hàm đóng Modal
        function closeModal() {
            document.getElementById('consultModal').style.display = 'none';
        }

        // Hàm xử lý gửi form về Nicegram / Telegram
        function submitModalForm() {
            let name = document.getElementById('modal-name').value.trim();
            let phone = document.getElementById('modal-phone').value.trim();
            let msg = document.getElementById('modal-msg').value.trim();

            if (!name || !phone) {
                alert('Vui lòng điền đầy đủ Họ tên và Số điện thoại!');
                return;
            }

            // Đã cấu hình Token và Chat ID của bạn
            const telegramBotToken = '8813015366:AAFOQFJPOocEUWsZ3VmXONRekC7btL3wJ9Y';
            const chatId = '1869431637';

            // Nội dung tin nhắn báo về Nicegram
            const textContent = 
`🔔 **CÓ KHÁCH HÀNG ĐĂNG KÝ TƯ VẤN MỚI!**
-----------------------------
👤 **Họ tên:** ${name}
📞 **Số điện thoại:** ${phone}
💬 **Lời nhắn:** ${msg || 'Không có'}
⏰ **Thời gian:** ${new Date().toLocaleString('vi-VN')}`;

            // Gửi dữ liệu qua Telegram API
            fetch(`https://api.telegram.org/bot${telegramBotToken}/sendMessage`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    chat_id: chatId,
                    text: textContent,
                    parse_mode: 'Markdown'
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.ok) {
                    alert('Đăng ký thành công! Trung tâm sẽ liên hệ lại với bạn sớm nhất.');
                    closeModal();
                    // Reset thông tin trong form
                    document.getElementById('modal-name').value = '';
                    document.getElementById('modal-phone').value = '';
                    document.getElementById('modal-msg').value = '';
                } else {
                    alert('Có lỗi xảy ra khi gửi đăng ký. Vui lòng thử lại!');
                    console.error('Lỗi API:', data);
                }
            })
            .catch(error => {
                console.error('Lỗi kết nối:', error);
                alert('Không thể kết nối đến máy chủ. Vui lòng thử lại sau!');
            });
        }
    </script>
</body>
</html>
